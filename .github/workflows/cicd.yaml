name: cicd

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: yeni-clusterim

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Test container
        run: |
          docker run -d --name test-app -p 8000:8000 $IMAGE_NAME:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8000/
          curl --fail http://localhost:8000/health
          docker stop test-app

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      - name: Update Kubernetes image
        run: |
          sed -i \
            "s|IMAGE_PLACEHOLDER|$IMAGE_NAME:${{ github.sha }}|g" \
            k8s/deployment.yaml

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/dummy-microservice --timeout=180s

      - name: Show Kubernetes resources
        run: |
          kubectl get pods -o wide
          kubectl get services
