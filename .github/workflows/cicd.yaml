name: cicd

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  issues: write
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: yeni-clusterim

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository kodunu al
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. SAST - SonarQube
      - name: SonarQube SAST Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 3. GitHub Container Registry'ye giriş
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Docker image oluştur
      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} .

      # 5. Container'ı lokal olarak test et
      - name: Test container
        run: |
          docker run -d --name test-app -p 8000:8000 $IMAGE_NAME:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8000/
          curl --fail http://localhost:8000/health
          docker stop test-app

      # 6. Image'ı GHCR'a gönder
      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}

      # 7. AWS authentication
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 8. AWS bağlantısını doğrula
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 9. EKS kubeconfig oluştur
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # 10. Manifestteki image placeholder'ı yeni image ile değiştir
      - name: Update Kubernetes image
        run: |
          sed -i \
            "s|IMAGE_PLACEHOLDER|$IMAGE_NAME:${{ github.sha }}|g" \
            k8/deployment.yaml

      # 11. EKS'e deploy et
      - name: Deploy to EKS
        run: |
          kubectl apply -f k8/

      # 12. Podların ayağa kalkmasını bekle
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/dummy-microservice --timeout=180s

      # 13. LoadBalancer hostname oluşmasını bekle
      - name: Wait for LoadBalancer hostname
        run: |
          echo "Waiting for LoadBalancer hostname..."

          for i in {1..30}; do
            LB_HOST=$(kubectl get svc dummy-microservice-service \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

            if [ -n "$LB_HOST" ]; then
              echo "LoadBalancer hostname: $LB_HOST"
              echo "APP_URL=http://$LB_HOST" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "LoadBalancer hostname not available yet..."
            sleep 10
          done

          echo "LoadBalancer hostname was not created in time."
          kubectl get svc
          exit 1

      # 14. AWS LoadBalancer DNS kaydının aktif olmasını bekle
      - name: Wait for LoadBalancer DNS
        run: |
          echo "Waiting for DNS: $APP_URL"

          LB_HOST="${APP_URL#http://}"

          for i in {1..30}; do
            if getent hosts "$LB_HOST" > /dev/null 2>&1; then
              echo "DNS is ready."
              getent hosts "$LB_HOST"
              exit 0
            fi

            echo "DNS not ready yet..."
            sleep 10
          done

          echo "LoadBalancer DNS could not be resolved."
          exit 1

      # 15. Gerçek uygulamanın cevap vermesini bekle
      - name: Wait for deployed application
        run: |
          echo "Waiting for application: $APP_URL/health"

          for i in {1..30}; do
            if curl \
              --connect-timeout 5 \
              --max-time 10 \
              --fail \
              "$APP_URL/health"; then

              echo ""
              echo "Application is ready."
              exit 0
            fi

            echo ""
            echo "Application not ready yet..."
            sleep 10
          done

          echo "Application did not become ready."
          exit 1

      # 16. Endpointleri son kez doğrula
      - name: Verify deployed application
        run: |
          curl --fail --max-time 15 "$APP_URL/"
          curl --fail --max-time 15 "$APP_URL/health"

      # 17. DAST - OWASP ZAP
      - name: OWASP ZAP Baseline DAST
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.APP_URL }}

      # 18. Pipeline başarılı/başarısız olsa da cluster durumunu göster
      - name: Show Kubernetes resources
        if: always()
        run: |
          kubectl get pods -o wide
          kubectl get services
