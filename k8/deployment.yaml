apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dummy-microservice
  template:
    metadata:
      labels:
        app: dummy-microservice
    spec:
      containers:
        - name: dummy-microservice
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 6
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
